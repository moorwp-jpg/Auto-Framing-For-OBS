name: Bug report
description: Report a reproducible problem in the public preview.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private information from logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: OBS, Windows, and plugin versions
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime Statistics and sanitized OBS log
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, private paths, and sensitive content.
          required: true
